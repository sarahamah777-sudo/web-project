<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Azure Crown Hotel & Suites</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

.hero{
    width:100%;
    height:100vh;

    background-image:
    linear-gradient(
    rgba(0,0,0,0.5),
    rgba(0,0,0,0.5)
    ),

    url("https://images.unsplash.com/photo-1566073771259-6a8506099945");

    background-size:cover;
    background-position:center;

    display:flex;
    justify-content:center;
    align-items:center;
}

.overlay{
    text-align:center;
    color:white;
}

.overlay h1{
    font-size:80px;
    letter-spacing:5px;
}

.overlay h2{
    font-size:35px;
    margin-top:10px;
    color:gold;
}

.overlay p{
    margin-top:20px;
    font-size:20px;
}

.overlay button{
    margin-top:30px;

    padding:15px 35px;

    border:none;
    border-radius:30px;

    background:gold;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    transition:0.4s;
}

.overlay button:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<section class="hero">

    <div class="overlay">

        <h1>AZURE CROWN</h1>

        <h2>HOTEL & SUITES</h2>

        <p>
            Experience Luxury, Comfort and Excellence
        </p>

        <button>Book Your Stay</button>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
